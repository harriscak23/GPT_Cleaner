name: ChatGPT Cleaner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * 6"

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          playwright install --with-deps 

      - name: Restore sessions
        run: |
          mkdir -p sessions

          echo "${{ secrets.CSE_SESSION_ZIP }}" | base64 -d > cse.zip
          unzip -o cse.zip -d sessions

          echo "${{ secrets.UW_SESSION_ZIP }}" | base64 -d > uw.zip
          unzip -o uw.zip -d sessions

          echo "${{ secrets.F04_SESSION_ZIP }}" | base64 -d > f04.zip
          unzip -o f04.zip -d sessions

          echo "${{ secrets.F23_SESSION_ZIP }}" | base64 -d > f23.zip
          unzip -o f23.zip -d sessions

          rm *.zip

      - name: Run cleaner
        run: |
          python clean.py
        
      - name: Persist refreshed sessions
        if: success()                              # only if the clean worked, so a broken session never overwrites a good one
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}     # permission to edit secrets (explained below)
        run: |
          for f in sessions/*.json; do             # once per account file, e.g. sessions/cse.json
            name=$(basename "$f" .json | tr a-z A-Z)                       # "cse" → "CSE"
            (cd sessions && zip -q "$name.zip" "$(basename "$f")")         # zip it, as you do by hand
            gh secret set "${name}_SESSION_ZIP" \
              --body "$(base64 -w0 sessions/$name.zip)"                    # base64 it and overwrite CSE_SESSION_ZIP
          done